<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Veranima 日志</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1e1e1e; color: #d4d4d4; font-family: Consolas, "Microsoft YaHei", monospace; font-size: 12px; height: 100vh; display: flex; flex-direction: column; }
    #toolbar { padding: 6px 10px; background: #252526; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #333; }
    #toolbar button { background: #333; color: #ccc; border: none; padding: 3px 10px; cursor: pointer; border-radius: 3px; font-size: 12px; }
    #toolbar button:hover { background: #444; }
    #status { margin-left: auto; color: #888; font-size: 11px; }
    #log { flex: 1; overflow-y: auto; padding: 6px 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    #log div:hover { background: #2a2d2e; }
    .core { color: #9cdcfe; }
    .core-err { color: #f48771; }
    .shell { color: #ce9178; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span>Veranima 日志</span>
    <button id="clear">清空</button>
    <span id="status"></span>
  </div>
  <div id="log"></div>
  <script src="log-renderer.js"></script>
</body>
</html>
