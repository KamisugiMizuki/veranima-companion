<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 13px/1.6 "Microsoft YaHei", sans-serif; background: #f5f6f7; overflow: hidden; }
  #header { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: #fff; border-bottom: 1px solid #e4e6eb; }
  #header .dot { width: 8px; height: 8px; border-radius: 50%; background: #95ec69; }
  #header .name { font-weight: 600; }
  #header .status { font-size: 11px; color: #999; }
  #msgs { height: calc(100vh - 44px - 60px); overflow-y: auto; padding: 12px; }
  .msg { display: flex; margin-bottom: 14px; }
  .msg.user { justify-content: flex-end; }
  .avatar { width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0; overflow: hidden;
    background: #e8eaed; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .msg.user .avatar { order: 2; margin-left: 8px; background: #a8c7fa; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .body { max-width: 70%; }
  .bubble { padding: 8px 12px; border-radius: 8px; word-break: break-word; white-space: pre-wrap; }
  .msg.pet .bubble { background: #fff; border: 1px solid #e4e6eb; border-top-left-radius: 2px; }
  .msg.user .bubble { background: #95ec69; border-top-right-radius: 2px; }
  .ts { font-size: 10px; color: #b0b3b8; margin-top: 2px; }
  .msg.user .ts { text-align: right; }
  #inputbar { height: 60px; background: #fff; border-top: 1px solid #e4e6eb;
    display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  #input { flex: 1; height: 34px; padding: 0 12px; border: 1px solid #d8dce3; border-radius: 6px;
    outline: none; font-size: 13px; }
  #send { height: 34px; padding: 0 18px; border: none; border-radius: 6px; background: #4e9bf7;
    color: #fff; cursor: pointer; font-size: 13px; }
  #send:disabled { background: #c9d4e0; cursor: default; }
  .typing { color: #999; font-size: 12px; }
</style>
</head>
<body>
  <div id="header">
    <span class="dot" id="statusDot"></span>
    <span class="name" id="charName">Yuki</span>
    <span class="status" id="statusText">正在输入…</span>
  </div>
  <div id="msgs"></div>
  <div id="inputbar">
    <input id="input" placeholder="对她说点什么…" autocomplete="off">
    <button id="send" disabled>发送</button>
  </div>
<script src="chat-renderer.js"></script>
</body>
</html>
