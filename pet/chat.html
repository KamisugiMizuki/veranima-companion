<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veranima 聊天</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <section class="chat-shell">
    <header class="character-header">
      <div class="identity">
        <div class="character-avatar"><img id="characterAvatar" alt="角色头像"><span id="avatarFallback">由</span></div>
        <div class="identity-copy">
          <strong id="charName">Veranima</strong>
          <span id="statusText" aria-live="polite">正在连接</span>
        </div>
        <span id="statusDot" class="status-dot" aria-hidden="true"></span>
      </div>
      <div class="header-actions">
        <button id="historyToggle" class="icon-button" type="button" title="搜索聊天记录" aria-label="搜索聊天记录" aria-pressed="false">⌕</button>
        <button id="archiveToggle" class="icon-button" type="button" title="人物档案" aria-label="人物档案" aria-pressed="false">▤</button>
        <button id="projectsToggle" class="icon-button" type="button" title="共同项目" aria-label="共同项目" aria-pressed="false">✦</button>
        <button id="muteToggle" class="icon-button" type="button" title="静音语音" aria-label="静音语音" aria-pressed="false">♫</button>
        <button id="clearChat" class="icon-button danger" type="button" title="清空聊天记录" aria-label="清空聊天记录">×</button>
      </div>
    </header>

    <section id="historyPanel" class="utility-panel" hidden aria-label="聊天记录搜索">
      <form id="searchForm" class="search-row">
        <label class="sr-only" for="historyQuery">搜索聊天记录</label>
        <input id="historyQuery" type="search" placeholder="搜索聊天记录" autocomplete="off">
        <button id="historySearch" class="small-button primary" type="submit">搜索</button>
        <button id="historyBack" class="small-button" type="button">返回会话</button>
      </form>
      <div id="searchMeta" class="utility-meta"></div>
    </section>

    <aside id="archivePanel" class="utility-panel archive-panel" hidden aria-label="人物档案">
      <div class="panel-heading"><strong>人物档案</strong><button id="archiveClose" class="plain-button" type="button" aria-label="关闭人物档案">收起</button></div>
      <div id="chapters" class="chapters"><span class="muted">正在读取章节…</span></div>
    </aside>

    <aside id="projectsPanel" class="utility-panel archive-panel" hidden aria-label="共同项目">
      <div class="panel-heading"><strong>共同项目</strong><button id="projectsClose" class="plain-button" type="button" aria-label="关闭共同项目">收起</button></div>
      <div id="projectsList" class="chapters"><span class="muted">正在读取项目…</span></div>
    </aside>

    <main id="messages" class="messages" role="log" aria-live="polite" aria-label="聊天消息">
      <div id="emptyState" class="empty-state">
        <div class="empty-avatar"><span>由</span></div>
        <strong>还没聊过。先说一句吧。</strong>
        <span>她会记住这次对话里真正重要的部分。</span>
        <div class="starter-row">
          <button class="starter" type="button" data-text="今天过得怎么样？">今天过得怎么样？</button>
          <button class="starter" type="button" data-text="我有件事想和你聊聊">我有件事想和你聊聊</button>
          <button class="starter" type="button" data-text="你现在在想什么？">你现在在想什么？</button>
        </div>
      </div>
      <button id="newMessageMarker" class="new-message-marker" type="button" hidden>有新消息</button>
    </main>

    <div id="notice" class="notice" role="alert" hidden>
      <span id="noticeText"></span>
      <button id="noticeAction" class="plain-button" type="button" hidden>重试</button>
      <button id="noticeClose" class="plain-button" type="button" aria-label="关闭提示">×</button>
    </div>

    <section id="imagePreview" class="image-preview" hidden aria-label="待发送图片"></section>

    <form id="composer" class="composer">
      <label class="sr-only" for="input">发送消息</label>
      <textarea id="input" rows="1" placeholder="对她说点什么…" autocomplete="off" spellcheck="true"></textarea>
      <div class="composer-actions">
        <span id="draftHint" class="draft-hint">Enter 发送 · Shift+Enter 换行</span>
        <button id="attachImage" class="icon-button" type="button" title="添加图片" aria-label="添加图片">▧</button>
        <button id="recordAudio" class="icon-button" type="button" title="录音转文字" aria-label="录音转文字">●</button>
        <button id="stopSpeaking" class="small-button" type="button" hidden>停止说话</button>
        <button id="stopReply" class="small-button danger" type="button" hidden>取消回复</button>
        <button id="send" class="send-button" type="submit" disabled>发送</button>
      </div>
    </form>
  </section>
  <script src="chat-renderer.js"></script>
</body>
</html>
