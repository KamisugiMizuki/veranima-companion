<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { height:100vh; display:flex; flex-direction:column; font: 13px/1.6 "Microsoft YaHei", sans-serif; background: #f5f6f7; overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #header { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: #fff; border-bottom: 1px solid #e4e6eb; }
  #header .dot { width: 8px; height: 8px; border-radius: 50%; background: #95ec69; }
  #header .name { font-weight: 600; }
  #header .status { font-size: 11px; color: #666; }  /* GUI_SPEC 11：对比度 >=4.5:1 */
  #msgs { flex:1; min-height:0; overflow-y: auto; padding: 12px; }
  #tools { height: 38px; display:flex; gap:6px; padding:5px 10px; background:#fafafa; border-bottom:1px solid #e4e6eb; }
  #historyQuery { flex:1; min-width:0; border:1px solid #d8dce3; border-radius:4px; padding:4px 8px; }
  #tools button { border:1px solid #d8dce3; background:#fff; border-radius:4px; padding:2px 8px; }
  #archive { margin:8px 12px; border:1px solid #e4e6eb; border-radius:5px; background:#fff; }
  #archive summary { cursor:pointer; padding:5px 8px; color:#59636f; }
  #chapters { padding:0 8px 8px; max-height:150px; overflow:auto; }
  .chapter { padding:6px 0; border-top:1px solid #f0f1f2; }
  .msg { display: flex; margin-bottom: 14px; }
  .msg.user { justify-content: flex-end; }
  .avatar { width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0; overflow: hidden;
    background: #e8eaed; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .msg.user .avatar { order: 2; margin-left: 8px; background: #a8c7fa; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .body { max-width: 70%; }
  .bubble { padding: 8px 12px; border-radius: 8px; word-break: break-word; white-space: pre-wrap; }
  .msg.pet .bubble { background: #fff; border: 1px solid #e4e6eb; border-top-left-radius: 2px; }
  .msg.user .bubble { background: #95ec69; border-top-right-radius: 2px; }
  .ts { font-size: 10px; color: #767676; margin-top: 2px; }  /* 对比度修正 */
  .msg.user .ts { text-align: right; }
  #inputbar { height: 60px; background: #fff; border-top: 1px solid #e4e6eb;
    display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  #input { flex: 1; height: 34px; padding: 0 12px; border: 1px solid #d8dce3; border-radius: 6px;
    font-size: 13px; }
  #input:focus-visible { outline: 2px solid #4e9bf7; outline-offset: 1px; }  /* GUI_SPEC 11 */
  #send:focus-visible { outline: 2px solid #2b6cb0; outline-offset: 2px; }
  #send { height: 34px; padding: 0 18px; border: none; border-radius: 6px; background: #4e9bf7;
    color: #fff; cursor: pointer; font-size: 13px; }
  #send:disabled { background: #c9d4e0; cursor: default; }
  .typing { color: #666; font-size: 12px; }
  .empty { color: #666; text-align: center; margin-top: 48px; font-size: 12px; }  /* 空态 */
  /* GUI_SPEC 10/11：reduced motion + 允许复制 */
  .msg .bubble { user-select: text; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div id="header">
    <span class="dot" id="statusDot"></span>
    <span class="name" id="charName">Yuki</span>
    <span class="status" id="statusText">连接中…</span>
  </div>
  <div id="tools"><input id="historyQuery" placeholder="搜索聊天记录" aria-label="搜索聊天记录"><button id="historySearch">搜索</button><button id="historyClear">清除</button></div>
  <details id="archive"><summary>人物档案</summary><div id="chapters">暂无章节</div></details>
  <main id="msgs" role="log" aria-live="polite"></main>
  <form id="inputbar">
    <label for="input" class="sr-only">发送消息</label>
    <input id="input" placeholder="对她说点什么…" autocomplete="off">
    <button id="send" disabled>发送</button>
  </form>
<script src="chat-renderer.js"></script>
</body>
</html>
