<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Veranima 现状思维导图</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mind-elixir@6.0.0-next.4/dist/MindElixir.css">
<style>
  html, body { margin: 0; height: 100%; background: #FAF9F5; }
  #map { width: 100%; height: 100%; }
  #hint { position: fixed; top: 10px; left: 14px; font: 13px sans-serif;
          color: #8E8B82; background: #EFE9DEd0; padding: 5px 10px; border-radius: 8px; z-index: 9; }
</style>
</head>
<body>
<div id="hint">字号 = 概括层级 · 滚轮缩放 · 空白处拖拽平移 · 点节点圆圈折叠展开</div>
<div id="map"></div>
<script type="module">
import MindElixir from "https://cdn.jsdelivr.net/npm/mind-elixir@6.0.0-next.4/+esm";

// MindElixir nodeData.style 直接应用到节点 DOM（源码 ge() 实测）
const STY = [
  { fontSize: "30px", fontWeight: 700, color: "#fff", background: "#CC785C", padding: "10px 18px", borderRadius: "14px" },
  { fontSize: "20px", fontWeight: 600, color: "#A9583E", background: "#EFE9DE", padding: "5px 10px", borderRadius: "9px" },
  { fontSize: "15px", fontWeight: 500, color: "#3D3D3A", background: "#F5F1EA", padding: "3px 8px", borderRadius: "7px" },
  { fontSize: "12.5px", color: "#6C6A64" },
];
let c = 0;
// v6 源码：init 里 this.nodeData=e.nodeData（根包一层），子节点是裸对象 {id,topic,style,children}
const t = (topic) => ({ id: "k" + c++, topic, style: { ...STY[3] }, children: [] });
const nd = (topic, L, children) => ({ id: "k" + c++, topic, style: { ...STY[Math.min(L, 3)] }, expanded: false, children });

const data = {
  nodeData: {
    id: "root", topic: "Veranima 陪伴角色应用", style: { ...STY[0] }, children: [
      nd("① Python 核心", 1, [
        nd("agent 中枢", 2, [
          t("handle 对话全链"), t("tick 仪式引擎 问候>节庆>饭点"),
          t("睡眠周期 报告→记录→总结→适应"), t("追问闭环 / 翻旧账 / 被看穿"),
        ]),
        nd("人格与关系", 2, [
          t("persona 七维+五阶段+PAD"), t("tension 关系张力"),
          t("state 能量/情绪/依恋/睡中"), t("learning 文风学习"),
        ]),
        nd("虚拟生活", 2, [
          t("日程模板/角色作息"), t("次日计划生成"), t("场景锁 忙/睡限交互"),
        ]),
        nd("表达解析", 2, [
          t("reply 泄漏防护 红线"), t("segments 双语音频/显示"), t("tone 情绪分类"),
        ]),
        nd("执行后端 R5", 2, [
          t("workorder / task_session"), t("hermes_bridge 委托"), t("审批+写边界+审计"),
        ]),
        nd("主动与感知", 2, [
          t("proactive 问候/三餐/节庆"), t("attention 视觉注意力"), t("UsageStats 前台感知"),
        ]),
      ]),
      nd("② 记忆层", 1, [
        t("store ADD-only+版本链"), t("recall 向量+全文+新近"),
        t("decay 衰减 核心豁免"), t("erase 删除三清"),
        t("schema 11 表+迁移"), t("embedding 远程/本地"), t("brief 注入预算裁剪"),
      ]),
      nd("③ 模型与媒体", 1, [
        t("llm DeepSeek 远程"), t("vision 按图自动切换"),
        t("tts GPT-SoVITS yuki"), t("stt SenseVoice"), t("search 博查 / SearXNG"),
      ]),
      nd("④ 安卓 APK 主形态", 1, [
        nd("Kotlin Compose UI", 2, [
          t("视觉小说舞台 立绘+毛玻璃"), t("面板两态 拖拽跟手"),
          t("相册选择器/时间戳/情绪标签"), t("设置页 API分组/成长树/记忆库/睡眠记录"),
          t("CompanionService 保活+横幅↔气泡"),
        ]),
        nd("bridge.py 同进程桥", 2, [
          t("boot / chat / tick / drain"), t("growth / memories / sleep_cycles"),
        ]),
        t("Chaquopy 打包 复用核心"),
      ]),
      nd("⑤ 桌宠壳 Electron", 1, [
        t("main.js 进程编排"), t("透明置顶窗 立绘+气泡"), t("聊天/设置/日志窗"),
      ]),
      nd("⑥ 角色", 1, [t("凛 lin 默认"), t("由岐 yuki +voice"), t("zima 旧卡")]),
      nd("⑦ 数据 单SQLite", 1, [
        t("memories + FTS + 向量"), t("messages 原始对话"),
        t("sleep_cycles / virtual_life"), t("proactive_feedback"),
      ]),
      nd("⑧ 入口", 1, [t("app 工厂"), t("cli 调试"), t("pet_server WS核心")]),
      nd("⚠ 结构矛盾候选", 1, [
        t("QQ退役 但60K代码在"), t("stickers 安卓砍 桌宠留"), t("桌宠定位悬空"),
        t("双主动路径并存"), t("测试基线3红"), t("quiet_hours 残留"),
      ]),
    ],
  },
};

const ME = new MindElixir({
  el: "#map",
  direction: MindElixir.RIGHT,
  editable: false,
  draggable: true,
  contextmenu: false,
  toolBar: false,
  keypress: false,
  allowUndo: false,
  scaleSensitivity: 10,
});
ME.init(data);
</script>
</body>
</html>
