# Veranima 默认配置模板
# 复制为 config.yaml 使用（config.yaml 不入库）；留空值使用代码内默认。
#
# LLM（OpenAI 兼容远程 API；DeepSeek/通义/硅基流动等，任一即可，无需本地环境）
llm:
  base_url: "https://api.deepseek.com/v1"   # OpenAI 兼容 API 地址（示例：DeepSeek/通义/硅基流动）
  model: "deepseek-chat"                     # 模型名（远程 API 按服务商提供；示例：deepseek-chat / qwen-plus）
  api_key: ""                                # 远程 API 必填；留空则无法鉴权
  temperature: 0.8
  # max_tokens 只限制输出（单次回复长度），不影响输入上下文；
  # 4096 对陪伴对话足够，无需随 context 上调
  max_tokens: 4096
  # 短任务（主动发起/衔接语/观察联想等）输出预算：思考模型会先耗 token 在 thinking，
  # 低于 256 会只剩残留（历史教训：200 → "0.8, stable companion, natural"）
  short_task_max_tokens: 1024
  # 低精力时的简短回复配置
  low_energy_max_tokens: 256
  timeout: 120
  active_profile: default
  profiles:
    default:
      name: "远程 API"
      base_url: "https://api.deepseek.com/v1"
      model: "deepseek-chat"
      api_key: ""
      temperature: 0.8
      max_tokens: 4096
      timeout: 120
    lm-studio:
      name: "LM Studio"
      base_url: "http://localhost:12345/v1"
      model: "qwen3.5-9b-uncensored-hauhaucs-aggressive@q4_k_m"
      api_key: ""
      temperature: 0.8
      max_tokens: 4096
      timeout: 180

# R0 统一 Reply 输出契约（R0_SPEC 6）
output:
  max_segments: 6                  # TTS JSON segments 最多段数
  max_text_chars: 1200             # 单段/整条回复文本截断上限（字符）
  parse_retry: 1                   # 解析重试次数（当前解析器确定性，保留配置位）
  keep_text_on_tts_failure: true   # TTS 失败保留文字气泡（R2_SPEC 6）

# TTS（桌宠语音；当前生产实现为本地 GPT-SoVITS v4 HTTP 服务）
# 壳启动时拉起 tts/gpt-sovits/api_v2.py，默认监听 http://127.0.0.1:9880。
# 远程 OpenAI 兼容 TTS 仍可通过 provider/base_url 接入，但不是角色默认链路。
tts:
  provider: gpt-sovits
  base_url: ""                          # 留空 = TTS 关闭（桌宠只显示气泡不发声）
  model: "gpt-sovits-v4"
  voice: "yuki"
  api_key: ""                           # 远程必填；本地服务通常不需要
  response_format: "wav"                # wav/mp3/opus（GPT-SoVITS 当前使用 wav）
  timeout: 60
  segment_mode: whole                   # 整段合成（R2_SPEC 6；分句模式已废弃）

# STT 语音输入：默认本地 SenseVoiceSmall，支持同段中英日混说；中文优先只用于降级策略
stt:
  enabled: true
  base_url: "http://127.0.0.1:9890/v1"
  model: "sensevoice-small"
  language: "auto"
  language_priority: [zh, en, ja]
  input_device_id: ""                  # 留空=系统默认；设置页可选择具体麦克风
  api_key: ""
  device: "cpu"
  model_path: "data/models/sensevoice-small"
  vad_model_path: "tts/gpt-sovits/tools/asr/models/speech_fsmn_vad_zh-cn-16k-common-pytorch"
  timeout: 120
  max_audio_bytes: 20971520

# 角色卡（CCv3 兼容 JSON；留空则用内置示例卡）
character_card: "config/character.json"

# 联网搜索（DESIGN.md 8.5：工具调用，模型自主判断；默认关闭）
search:
  enabled: false
  base_url: "http://127.0.0.1:8080"
  max_results: 4

# 记忆
memory:
  db_path: "data/veranima.db"
  # embedding 三种模式：
  #   local:data/models/bge-m3  → 本地模型（ModelScope 下载，隐私最好）
  #   openai:bge-m3              → API embedding（复用 llm 的 base_url/api_key）
  #   ollama:bge-m3              → Ollama embedding
  embedding_model: "local:data/models/bge-m3"   # 默认本地（多数远程 API 不提供 embeddings 接口；需先放置模型或从 object_design 拷贝）
  recall_top_k: 5
  recall_threshold: 0.3
  max_injected_chars: 5600              # R1：记忆注入总预算（R1_SPEC 4）
  candidate_extraction: rules           # R1：候选记忆提取模式（rules=规则提取，llm=LLM 提取）
  correction_enabled: true              # R1：用户纠正写新版本链（R1_SPEC 3）
  core_profile_budget: 2000             # 字符预算（远程 API 上调；本地小 context 改回 1200）
  section_budget: 2400
  session_budget: 1200
  # 遗忘衰减
  decay_enabled: true
  decay_interval_minutes: 60            # 后台衰减任务间隔
  importance_base_s: 2592000            # 重要性=0.5 时半衰期（秒，默认30天）

# 状态
state:
  energy_max: 100
  energy_decay_per_minute: 0.02         # 每分钟衰减
  energy_recover_per_message: 3.0       # 每条消息恢复
  attachment_growth: 0.05               # 每轮依恋度增长
  initial_attachment: 0.5               # 初始依恋度（0=初识 0.5=半亲密 0.75=亲密）
  social_appetite_initial: 0.8          # R1：初始社交欲 0-1（R1_SPEC 5）

# CLI
cli:
  prompt_style: "rich"                  # rich / plain
  user_name: "你"

# QQ（NapCatQQ 接入，DESIGN.md：OneBot v11 协议反向 WebSocket，1v1 私聊）
# 前置：NapCatQQ 已登录并配置"反向 WebSocket 客户端"连接
#       ws://<ws_host>:<ws_port>/ws（默认 127.0.0.1:8099；8080 被本机 SearXNG 占用，勿用）
qq:
  enabled: false                        # python -m veranima.qq 是否启用 QQ 形态
  ws_host: "127.0.0.1"                  # 本机监听地址（NapCat 与 bot 同机）
  ws_port: 8099                         # aiocqhttp 反向 WS 服务端口
  access_token: ""                      # NapCat 若配置了 access_token 则填写
  allowed_qq: []                        # 白名单 QQ 号（1v1：只填你自己的号；空 = 拒绝所有）
  image_roots: []                       # NapCat 本地图片缓存根目录；空 = 仅项目 data/ 与根目录
  trusted_image_proxy: false            # Clash fake-IP 用户显式开启；仅下方 QQ CDN allowlist 生效
  image_proxy_hosts: ["multimedia.nt.qq.com", "multimedia.nt.qq.com.cn"]
  proactive: true                       # 定时问候 + 节庆纪念（每日去重）
  # 主动消息延迟（分钟）：对话静默满该时长后才发送 turn 内触发的主动消息，
  # 避免"回复 + 主动"双连发（真人不会秒补一句无关话题）
  proactive_delay_minutes: 5
  # 静默时段 [开始小时, 结束小时]：此时间段不主动发任何消息（问候/离线思考），
  # 支持跨午夜（23 点 ~ 次日 8 点）。空 [] 或 null = 不限制。
  quiet_hours: [23, 8]
  # 8.7.4 离线思考：对话静默 N 分钟后，低概率补发一条"迟来的回应"
  offline_think:
    enabled: true
    silence_minutes: 30                 # 静默多少分钟后可能触发
    probability: 0.3                    # 基础触发概率（0~1）；每次窗口掷一次骰
    growth_factor: 0.08                 # 未命中时概率增长量（"想念"积累，0=关闭）
    max_probability: 0.95               # 概率增长上限（发送后重置回基础值）
    max_per_day: 2                      # 每日最多触发次数（0 = 不限；防整夜轰炸）
  # 8.6.3 表情包库：用户发图 → 没见过的 LLM 标注入库；回复时按情绪宽松匹配发送
  stickers:
    enabled: false                      # 默认关闭（需要多模态模型支持）
    dir: "data/stickers"                # 存储目录（图片 + index.json 标注）

# 统一对话配置（只能保留这一段 chat，避免 YAML 重复键覆盖）
chat:
  history_max_messages: 50
  curator_turns: 8
  short_task_max_tokens: 1024
  max_reply_chars: 1200
  # 兼容旧配置；实现 R4 后不再作为主动入口
  proactive_message_prob: 0.0

# R4 主动性：观察/记忆只生成候选，统一由程序闸门裁决
proactive:
  enabled: true
  quiet_hours_enabled: true
  quiet_hours: [23, 8]
  global_max_per_day: 0
  channels:
    qq:
      enabled: true
      min_gap_minutes: 120
      source_gap_minutes: 120
      max_per_day: 2
      evaluation_interval_minutes: 15
      post_silence_buffer_minutes: 30
      sleep_silence_hours: 8
      sleep_min_hours: 6
      sleep_max_hours: 12
      low_activity_multiplier: 0.3
      ignored_reply_window_hours: 24
    pet:
      enabled: true
      min_gap_minutes: 30
      source_gap_minutes: 120
      max_per_day: 2
  ignore_backoff: true
  visual_candidates: true

# R4 视觉注意力：默认只保存短期摘要，不保存原始截图
attention:
  enabled: true
  paused: false
  global_scan_sec: 5
  mouse_focus_stay_sec: 2
  habituation_sec: 60
  observe_cache_ttl_sec: 120
  observe_daily_budget: 120
  crop_ratio: 0.30
  save_raw_images: false
  sensitive_categories: [password, payment, private, meeting, lockscreen]

# R3 Electron 桌宠 UI
pet:
  enabled: true
  avatar_height: 200
  onboarding: true
  chat_history_limit: 500
  chat_batch_size: 40
  keep_text_on_tts_failure: true
  autoplay: true
  reduced_motion: false
  theme_accent: "#4f78a8"               # 角色包可覆盖；错误/成功语义色不可覆盖

# R5 外部任务协作，默认关闭且要求用户确认
tasks:
  enabled: false
  require_confirmation: true
  timeout_seconds: 600
  output_max_chars: 12000
  allowed_types: [文档处理, 信息检索, 系统操作, 自动化流程]

