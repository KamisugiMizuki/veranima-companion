[project]
name = "veranima-companion"
version = "0.1.0"
description = "一个给予用户真实感的情感陪伴 agent：固定人格 + 长期记忆与遗忘 + 学习式自我修改"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6",
    "aiocqhttp>=1.4",
    "bayesianbandits>=1.4",
    "rich>=13",
    "prompt-toolkit>=3.0",
    "APScheduler>=3.10",
    # 运行时基础设施（原为传递依赖，显式声明避免新环境缺失）
    "httpx>=0.27",
    "sqlite-vec>=0.1",
    "pillow>=10",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
