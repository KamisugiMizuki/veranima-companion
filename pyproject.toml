[project]
name = "veranima-companion"
version = "0.1.0"
description = "一个给予用户真实感的情感陪伴 agent：固定人格 + 长期记忆与遗忘 + 学习式自我修改"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6",
    "aiocqhttp>=1.4",
    "bayesianbandits>=1.4",
    "rich>=13",
    "prompt-toolkit>=3.0",
    "APScheduler>=3.10",
    # 运行时基础设施（原为传递依赖，显式声明避免新环境缺失）
    "httpx>=0.27",
    "sqlite-vec>=0.1",       # 仅老库 vec0→blob 一次性迁移用（运行时向量检索=纯 numpy）
    "numpy>=1.26",           # memory_embedding 暴力余弦（_knn 矩阵乘）
    "pillow>=10",
    "pyyaml>=6",
    "sentence-transformers>=3",  # 本地 embedding（bge-m3，远程 API 不支持 embeddings 时必需）
    "websockets>=12",            # 桌宠壳 WS 通信（R3_SPEC 1.进程与协议）
    "fastapi>=0.110",            # 本地 STT 服务（OpenAI 兼容 /v1/audio/transcriptions）
    "uvicorn>=0.27",             # 本地 STT 服务 ASGI
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
